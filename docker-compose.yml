# Ambiente local. `docker compose up --build`
#   API:     http://localhost:4000/api/v1/health
#   Docs:    http://localhost:4000/api/docs
services:
  postgres:
    # Usado a partir da Fase 1 (EF Core). Mesma versão major que o RDS de produção.
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: floruna
      POSTGRES_USER: floruna
      POSTGRES_PASSWORD: floruna_dev_only
    ports:
      # 5433 no host para não colidir com outro Postgres local.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U floruna -d floruna"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Cors__AllowedOrigins__0: http://localhost:3000
      ConnectionStrings__Floruna: Host=postgres;Port=5432;Database=floruna;Username=floruna;Password=floruna_dev_only
      Database__MigrateOnStartup: "true"
      # O MESMO segredo do front (proxy.ts). Nome legado do Nest aceito.
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      Jwt__Secret: ""
      Platform__Domain: localhost
      # Telemetria: vazio = só coleta, sem exportar. Com o perfil "observability", aponte para o painel.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: floruna-api
      # Teste de carga (load/): todo o tráfego do k6 vem de UM IP; suba o limite só para o teste.
      RateLimiting__CheckoutPermitLimit: ${CHECKOUT_RATE_LIMIT:-30}
      # Seed de desenvolvimento: loja flora-lis + usuário master.
      Seed__AdminEmail: admin@floraelis.com.br
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-troque-esta-senha-local}
      Seed__SuperAdminEmail: suporte@floruna.com.br
      Seed__SuperAdminPassword: ${SEED_SUPERADMIN_PASSWORD:-troque-esta-senha-local}
      # E-mail (e 2FA): descomente e suba com `docker compose --profile mail up`.
      # Os e-mails aparecem em http://localhost:8025
      # Smtp__Host: mailpit
      # Smtp__Port: "1025"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  mailpit:
    # SMTP falso para desenvolvimento: captura os e-mails (2FA, reset) numa interface web.
    image: axllent/mailpit:latest
    profiles: ["mail"]
    ports:
      - "8025:8025"

  aspire-dashboard:
    # Painel local de traces, métricas e logs (OTLP). Suba com:
    #   OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889 docker compose --profile observability up
    # e abra http://localhost:18888
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.5
    profiles: ["observability"]
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true" # só local
    ports:
      - "18888:18888"

volumes:
  pgdata:
