name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Floruna.slnx

      - name: Build (warnings = erros)
        run: dotnet build Floruna.slnx --no-restore -c Release

      - name: Format check
        run: dotnet format Floruna.slnx --verify-no-changes --no-restore

      - name: Migrations em dia com o modelo
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes -p src/Floruna.Infrastructure -s src/Floruna.Infrastructure

      # O contrato HTTP (docs/openapi/v1.json) é verificado nos testes de integração (OpenApiContractTests):
      # mudou o contrato sem atualizar o snapshot, o build quebra (RNF-10).
      - name: Test (unit + architecture + integration + contrato)
        run: dotnet test Floruna.slnx --no-build -c Release --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Vulnerable packages
        run: |
          dotnet list Floruna.slnx package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          ! grep -q -i "has the following vulnerable packages" vuln.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml

  infra:
    runs-on: ubuntu-latest
    env:
      JSII_RUNTIME_PACKAGE_CACHE: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4 # o CDK em C# roda sobre jsii (Node.js)
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Format check (infra)
        working-directory: infra
        run: dotnet format Floruna.Infra.sln --verify-no-changes
      - name: Testes da infraestrutura (asserções no CloudFormation + cdk-nag)
        working-directory: infra
        run: dotnet test -c Release
      - name: Synth (staging e produção)
        working-directory: infra
        run: |
          npx --yes aws-cdk@2 synth -q -c env=staging -c imageTag=${{ github.sha }} -c account=000000000000
          npx --yes aws-cdk@2 synth -q -c env=prod -c imageTag=${{ github.sha }} -c account=000000000000 \
            -c certificateArn=arn:aws:acm:sa-east-1:000000000000:certificate/ci-placeholder

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
      packages: write # publicar no ghcr.io (só em push na main)
    steps:
      - uses: actions/checkout@v4
      - name: Nome da imagem
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Build
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:main" .
      # Só a main publica: é dessa imagem que o deploy na VPS (deploy-vps.yml) faz pull.
      - name: Publica no ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:main"
